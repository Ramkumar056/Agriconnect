<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – AgriConnect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f4f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1); width: 100%; max-width: 380px; }
        h2 { color: #2d6a2d; margin-bottom: 1.5rem; text-align: center; }
        label { display: block; font-size: .85rem; margin-bottom: .25rem; color: #555; }
        input { width: 100%; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 1rem; font-size: 1rem; }
        button { width: 100%; padding: .75rem; background: #2d6a2d; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #245424; }
        .error { color: #c0392b; font-size: .85rem; margin-bottom: .75rem; }
        .footer { text-align: center; margin-top: 1rem; font-size: .85rem; }
        a { color: #2d6a2d; }
    </style>
</head>
<body>
<div class="card">
    <h2>🌾 AgriConnect Login</h2>
    <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
        <p class="error" id="error"></p>
        <button type="submit">Login</button>
    </form>
    <div class="footer">Don't have an account? <a href="/pages/register.html">Register</a></div>
</div>
<script src="/js/auth.js"></script>
<script>document.getElementById('loginForm').addEventListener('submit', handleLogin);</script>
</body>
</html>
