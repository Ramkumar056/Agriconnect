<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – AgriConnect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f4f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1); width: 100%; max-width: 420px; }
        h2 { color: #2d6a2d; margin-bottom: 1.5rem; text-align: center; }
        label { display: block; font-size: .85rem; margin-bottom: .25rem; color: #555; }
        input, select { width: 100%; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 1rem; font-size: 1rem; }
        button { width: 100%; padding: .75rem; background: #2d6a2d; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #245424; }
        .error { color: #c0392b; font-size: .85rem; margin-bottom: .75rem; }
        .footer { text-align: center; margin-top: 1rem; font-size: .85rem; }
        a { color: #2d6a2d; }
    </style>
</head>
<body>
<div class="card">
    <h2>🌾 Create Account</h2>
    <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="Raju Farmer">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Min 6 characters">
        <label>Role</label>
        <select id="role">
            <option value="farmer">Farmer</option>
            <option value="buyer">Buyer</option>
        </select>
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="9876543210">
        <label>Location</label>
        <input type="text" id="location" placeholder="City / Village">
        <p class="error" id="error"></p>
        <button type="submit">Register</button>
    </form>
    <div class="footer">Already have an account? <a href="/pages/login.html">Login</a></div>
</div>
<script src="/js/auth.js"></script>
<script>document.getElementById('registerForm').addEventListener('submit', handleRegister);</script>
</body>
</html>
